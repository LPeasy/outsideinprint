{{- $page := .page -}}
{{- $cartoon := .cartoon -}}
{{- $class := .class | default "" -}}
{{- with $cartoon -}}
  {{- $imageModel := partial "images/model.html" (dict
    "page" $page
    "ref" .image
    "display" true
  ) -}}
  <button
    type="button"
    class="essay-cartoon-thumb{{ with $class }} {{ . }}{{ end }}"
    data-essay-cartoon-lightbox-trigger
    data-cartoon-slug="{{ .slug }}"
    data-title="{{ .title }}"
    data-date="{{ .date }}"
    data-date-label="{{ time.Format "Jan 2, 2006" .date }}"
    data-image="{{ $imageModel.lightbox_url }}"
    data-alt="{{ .alt }}"
    data-width="{{ $imageModel.lightbox_width }}"
    data-height="{{ $imageModel.lightbox_height }}"
    data-gallery="{{ (printf "gallery/?cartoon=%s" .slug) | absURL }}"
    aria-label="Open the illustration for {{ $page.Title }} fullscreen"
  >
    {{- partial "images/picture.html" (dict
      "model" $imageModel
      "alt" ""
      "loading" "lazy"
      "sizes" "7rem"
      "lightbox" true
    ) -}}
    <span>Illustration</span>
  </button>
{{- end -}}
