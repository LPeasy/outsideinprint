<script data-oip-route-script="masthead-navigation">
(function () {
  function mount(scope) {
    var nav = document.querySelector("[data-primary-nav]");

    if (!nav) {
      return;
    }

    var disclosures = Array.prototype.slice.call(nav.querySelectorAll("[data-primary-nav-disclosure]"));
    var breakpoint = window.matchMedia("(max-width: 768px)");

    function closeDisclosure(disclosure, restoreFocus) {
      if (!disclosure.open) {
        return;
      }

      disclosure.open = false;

      if (restoreFocus) {
        var summary = disclosure.querySelector("summary");
        if (summary) {
          summary.focus();
        }
      }
    }

    function closeAll(except) {
      disclosures.forEach(function (disclosure) {
        if (disclosure !== except) {
          closeDisclosure(disclosure, false);
        }
      });
    }

    disclosures.forEach(function (disclosure) {
      scope.on(disclosure, "toggle", function () {
        if (disclosure.open) {
          closeAll(disclosure);
        }
      });

      scope.on(disclosure, "keydown", function (event) {
        if (event.key === "Escape" && disclosure.open) {
          event.preventDefault();
          closeDisclosure(disclosure, true);
        }
      });
    });

    scope.on(document, "pointerdown", function (event) {
      if (!nav.contains(event.target)) {
        closeAll();
      }
    });

    function handleBreakpointChange() {
      closeAll();
    }

    if (typeof breakpoint.addEventListener === "function") {
      scope.on(breakpoint, "change", handleBreakpointChange);
    } else if (typeof breakpoint.addListener === "function") {
      breakpoint.addListener(handleBreakpointChange);
    }

  scope.cleanup(function () { closeAll(); if (typeof breakpoint.removeListener === "function") breakpoint.removeListener(handleBreakpointChange); });
  }
  if (window.oipRegisterRouteWidget) {
    window.oipRegisterRouteWidget("masthead-navigation", mount);
  } else {
    mount({ on: function (target, type, callback, options) { target.addEventListener(type, callback, options); }, cleanup: function () {}, active: function () { return true; } });
  }
}());
</script>
