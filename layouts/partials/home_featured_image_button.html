{{- $page := .page -}}
{{- $model := .model -}}
<button class="home-v2-featured__image-toggle" type="button"
  data-home-featured-image-trigger
  data-image="{{ $model.lightbox_url }}"
  data-alt="{{ $page.Params.featured_image_alt | default "" }}"
  data-title="{{ $page.Title }}"
  data-width="{{ $model.lightbox_width }}"
  data-height="{{ $model.lightbox_height }}"
  aria-label="View illustration for {{ $page.Title }}"
  aria-haspopup="dialog" aria-controls="home-featured-image-dialog" hidden>
  <span aria-hidden="true">⌕</span>
</button>
<a class="home-v2-featured__image-toggle" data-home-featured-image-fallback
  href="{{ $model.lightbox_url }}" aria-label="View illustration for {{ $page.Title }}"><span aria-hidden="true">⌕</span>
</a>
