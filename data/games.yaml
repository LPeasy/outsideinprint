    features_heading: "A little author. A lot of personality."
    features_intro: "Three views. Eight original lo-fi tracks. 114 illustrated rewards to collect."
    features:
      - title: "Keep him beside your work"
        description: "Choose a compact, always-on-top Mini Companion, bring Pet Bob onto your desktop, or settle into Full Desk. Switch views whenever you like, keeping your progress and music with you."
      - title: "Give him a little attention"
        description: "Bob follows your nearby cursor, grabs on when you pick him up, and sticks the landing. Lend him the pointer for his signature or tempt his shadow into a dance. Choose Excited or Relaxed to set the pace of his Pet animations."
      - title: "Find your track on JUKE-BOB"
        description: "Open the gear and flip through JUKE-BOB's old-fashioned song cards. Choose from eight original lo-fi tracks by Robby V and the Paper Boys, with music from The Fine Print, Vol. 1, and adjust the volume. Bob may lean against the cabinet with a cheerful whistle."
      - title: "Watch your collection grow"
        description: "Collect 114 illustrated rewards as Bob finishes editions. Click and drag through framed prints, scroll between themed collections, and open an illustration for a closer look. Your collected prints and reading progress carry across all three views."
      - title: "Meet the writer behind the desk"
        description: "Outside In Print is Robert V. Ussley's independent publishing home for essays, dialogues and reflections. Follow a collected print to its optional source article in your browser. Companion play, rewards, music and saves use installed files."
    notices_heading: "Good to know"
    notices:
      - "Progress occurs only while a desk view is visible. Hidden and offline time do not advance the queue. There is no offline progression."
      - "All AI-assisted visual artwork is fixed and pre-generated before release. Original in-game music was created with Suno and bundled with the game. Idle Times accepts no prompts and makes no runtime generative-AI service or API calls."
      - "Illustrated rewards and optional linked essays may address war, political conflict, discrimination, public health, and other mature social topics. The game contains no gore, nudity, sexual content, or interactive gambling."
      - "Steam handles current pricing, purchase, accounts, and licenses. Outside In Print does not sell or license the game on this site."
