    features_heading: "A newsroom, a soundtrack and a shelf beside your day"
    features_intro: "Watch Bob work, choose the view that fits your desktop and open a comic when you want a break."
    features:
      - title: "Watch Bob at work"
        description: "Watch Bob research, check sources, write and work the press in Full Desk, Mini Companion or Pet Desk. He progresses automatically while visible and pauses while hidden."
      - title: "Settle into original music"
        description: "Pressroom Radio includes eight original lo-fi tracks by Robby V and the Paper Boys, with music from The Fine Print, Vol. 1. Choose tracks, save favorites and keep listening across all three desk views."
      - title: "Find your next read"
        description: "Collect 114 illustrated cartoon rewards through play. Browse by collection, search titles, filter unread comics and open uncropped artwork in a larger reader. New free editions are added every week."
      - title: "Choose the view that fits"
        description: "Use Full Desk, an always-on-top Mini Companion, or a movable and resizable Pet Desk. Reduce animations gives you a still room without changing edition timing."
      - title: "Keep the experience local"
        description: "The newsroom, rewards, music and saves use installed files. Source essays are optional reading. Steam handles purchases, accounts and licenses."
    notices_heading: "Good to know"
    notices:
      - "Progress occurs only while a desk view is visible. Hidden and offline time do not advance the queue. There is no offline progression."
      - "All AI-assisted visual artwork is fixed and pre-generated before release. Original in-game music was created with Suno and bundled with the game. Idle Times accepts no prompts and makes no runtime generative-AI service or API calls."
      - "Illustrated rewards and optional linked essays may address war, political conflict, discrimination, public health, and other mature social topics. The game contains no gore, nudity, sexual content, or interactive gambling."
      - "Steam handles current pricing, purchase, accounts, and licenses. Outside In Print does not sell or license the game on this site."
