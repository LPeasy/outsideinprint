  baseball_upside_risk:
    slug: "baseball-upside-risk"
    title: "Baseball Upside Risk"
    category: "Educational risk model"
    status: "In development"
    availability: "The interactive calculator and personalized reports are not currently available for use or purchase."
    promise: "Explain how public baseball base rates produce a zero-heavy gross-earnings distribution and a rare upside tail without predicting a named player."
    audience: "Families of high-school and NCAA baseball players seeking a sober view of the professional earnings path."
    intake_note: "This static preview collects no player profile, name, school, email address, payment, or report request."
    source_vintage_note: "This frozen B-GERM snapshot was generated May 14, 2026. It uses 2024-25 participation inputs and 2025 draft inputs; it is not a live 2026 probability estimate."
    preview_eyebrow: "Book-locked B-GERM snapshot"
    preview_title: "Broad-cohort baseline"
    preview_badge: "Fixed seed"
    preview_footer: "May 14, 2026 · 1,000,000 draws · broad U.S. high-school-senior cohort · gross earnings only"
    preview_accessible_label: "Baseball Upside Risk broad-cohort baseline summary"
    preview_components_label: "Baseball Upside Risk model views"
    preview_rows:
      - label: "Median gross professional earnings"
        value: "$0"
      - label: "Runs ending at $0"
        value: "99.509%"
      - label: "Runs above $0"
        value: "0.491%"
      - label: "Ever drafted"
        value: "0.535%"
      - label: "Signs a professional contract"
        value: "0.495%"
      - label: "Reaches MLB"
        value: "0.141%"
      - label: "Deterministic mean gross payoff"
        value: "$27,201"
        note: "Tail-sensitive; not a typical outcome."
    interpretation:
      kicker: "Mean and median"
      heading: "The median is $0. The mean is pulled upward by a rare tail."
      paragraphs:
        - "The median describes the middle of this broad-cohort distribution. With 99.509% of simulated runs ending at $0, that middle outcome is $0 in gross professional baseball earnings."
        - "The deterministic mean gross payoff is $27,201 across the cohort. A small number of high-earning paths pull that average upward, so it is tail-sensitive—not a typical outcome and not a forecast for a named player."
    snapshot_facts:
      - label: "Snapshot"
        value: "May 14, 2026"
      - label: "Cohort"
        value: "Broad U.S. high-school-senior baseball cohort"
      - label: "Simulation"
        value: "1,000,000 fixed-seed draws"
      - label: "Seed"
        value: "20260512"
      - label: "Terminal paths"
        value: "14"
      - label: "Earnings basis"
        value: "Gross professional baseball earnings only"
    workflow_heading: "From a broad cohort to a readable risk distribution"
    workflow_intro: "The method follows public base rates through mutually exclusive career paths, then reads the middle, the average, and the rare upside tail together."
    workflow:
      - step: "01"
        title: "Define the cohort"
        description: "Begin with a broad U.S. high-school-senior baseball cohort rather than a named player or recruiting profile."
      - step: "02"
        title: "Trace 14 paths"
        description: "Follow mutually exclusive paths through draft, signing, MLB reach, and gross professional earnings outcomes."
      - step: "03"
        title: "Simulate outcomes"
        description: "Run the book-locked model for one million draws with the fixed seed used for the May 14, 2026 snapshot."
      - step: "04"
        title: "Interpret together"
        description: "Read the median, mean, zero mass, pathway rates, and rare upside tail as one cohort-level record."
    deliverables:
      - title: "Draft pathway"
        description: "The modeled share of the broad cohort that is selected in the professional draft."
      - title: "Signing pathway"
        description: "The modeled share that signs a professional baseball contract after the draft pathway."
      - title: "MLB pathway"
        description: "The modeled share that reaches Major League Baseball within the frozen pathway structure."
      - title: "Earnings distribution"
        description: "The zero mass, median, deterministic mean, and rare gross-earnings tail viewed together."
      - title: "Terminal paths"
        description: "Fourteen mutually exclusive outcomes that account for the full modeled cohort."
      - title: "Assumptions"
        description: "A fixed snapshot built from approximate participation denominators and explicit gross-earnings boundaries."
      - title: "Sources"
        description: "Official NCAA, NFHS, MLB, and MLBPA materials support the participation, pathway, rules, and earnings assumptions."
    output_kicker: "Model views"
    output_heading: "Seven ways to inspect the frozen baseline"
    limitations:
      - "Educational cohort-level analysis only. It is not scouting, recruiting, scholarship, player-development, financial, tax, legal, investment, medical, or career advice."
      - "Not a prediction about a named player. Individual circumstances, ability, health, development, opportunity, and decisions are not modeled here."
      - "Gross professional baseball earnings only. The figures exclude taxes, agent fees, training, travel, showcases, lessons, scholarships, name, image, and likeness (NIL) income, family spending, and non-baseball opportunity costs."
      - "The frozen model uses approximate participation denominators and incomplete evidence for earnings in the lower parts of professional baseball careers."
      - "Independent and not affiliated with or endorsed by Major League Baseball, the Major League Baseball Players Association, the NCAA, the NFHS, any club, school, player, or recruiting service."
    limitations_heading: "A cohort model, not an individual forecast"
    privacy_heading: "Do not send player or family data"
    privacy_warning: "Do not send names, birth dates, schools, teams, contact details, recruiting profiles, health or injury information, financial information, credentials, or other personal data to the support address."
    companion_publication:
      kicker: "Companion publication"
      title: "Long Shots in the Big League"
      subtitle: "Baseball, Gross Earnings, and the Arithmetic of Risk"
      status: "Companion publication in preparation"
      description: "The book covers the history, records, and arithmetic behind the model."
      accessible_label: "Long Shots in the Big League companion publication notice"
    operator_legal_name: "Outside In Print LLC"
    seller_legal_name: "Outside In Print LLC"
    operator_line: "Baseball Upside Risk, a product operated and sold by Outside In Print LLC."
    support_email: "support@outsideinprint.org"
    support_line: "Support for Baseball Upside Risk is provided by Outside In Print LLC: support@outsideinprint.org."
    commercial_action_state: "disabled"
    back_link_state: "disabled"
    sample_downloads_state: "disabled"
