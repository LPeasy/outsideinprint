products:
  bucks_machine:
    slug: "bucks-machine"
    title: "Bucks Machine"
    status: "In development"
    availability: "Not currently available for use or purchase."
    promise: "Turn de-identified rough project notes into a human-reviewed scope, schedule, budget, risk, PDF, and workbook planning packet."
    audience: "Independent consultants who personally prepare scopes, schedules, budgets, and client planning packets."
    intake_note: "The workflow is AI-assisted and human-reviewed. No active intake is connected to this draft."
    workflow:
      - step: "01"
        title: "De-identified notes"
        description: "Start with rough planning notes after removing names, protected details, and sensitive project information."
      - step: "02"
        title: "Structured draft"
        description: "Bucks Machine organizes the notes into linked scope, schedule, budget, and risk sections."
      - step: "03"
        title: "Human review"
        description: "The consultant checks assumptions, corrects the draft, and decides what is fit for the engagement."
      - step: "04"
        title: "Planning packet"
        description: "The reviewed material is prepared as a readable PDF and a working spreadsheet."
    deliverables:
      - title: "Scope"
        description: "Outcomes, boundaries, assumptions, and exclusions organized for review."
      - title: "Schedule"
        description: "Milestones, durations, and dependencies arranged as a planning sequence."
      - title: "Budget"
        description: "Structured labor and cost assumptions in a reviewable workbook."
      - title: "Risk"
        description: "Risks, triggers, consequences, and response notes collected in one register."
      - title: "PDF"
        description: "A stable reading copy of the human-reviewed planning packet."
      - title: "Workbook"
        description: "An editable companion for checking and refining the structured inputs."
    preview_rows:
      - label: "Scope"
        value: "Outcomes and boundaries"
      - label: "Schedule"
        value: "Milestones and dependencies"
      - label: "Budget"
        value: "Structured cost assumptions"
      - label: "Risk"
        value: "Triggers and response notes"
    limitations:
      - "Planning support only. Every output requires human review before use."
      - "Not a certified estimate, final contract or statement of work, formal approval, government deliverable, or professional certification."
      - "No active intake, account, hosted workspace, or customer data connection is included in this draft."
    privacy_warning: "Do not provide confidential, government-sensitive, export-controlled, classified, procurement-sensitive, health, payment, identity, credential, legal-client, or other regulated or high-risk data."
    operator_legal_name: "Outside In Print LLC"
    seller_legal_name: "Outside In Print LLC"
    operator_line: "Bucks Machine, a product operated and sold by Outside In Print LLC."
    support_email: "support@outsideinprint.org"
    support_line: "Support for Bucks Machine is provided by Outside In Print LLC: support@outsideinprint.org."
    commercial_action_state: "disabled"
    sample_downloads_state: "local_draft"
    sample_downloads:
      - resource: "bucks-machine-synthetic-professional-services-demo.pdf"
        label: "Download synthetic PDF"
        format: "PDF"
      - resource: "bucks-machine-synthetic-professional-services-demo.xlsx"
