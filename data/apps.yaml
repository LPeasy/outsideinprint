        description: "Outcomes, boundaries, assumptions, and exclusions organized for review."
      - title: "Schedule"
        description: "Milestones, durations, and dependencies arranged as a planning sequence."
      - title: "Budget"
        description: "Structured labor and cost assumptions in a reviewable workbook."
      - title: "Risk"
        description: "Risks, triggers, consequences, and response notes collected in one register."
      - title: "PDF"
        description: "A stable reading copy of the human-reviewed planning packet."
      - title: "Workbook"
        description: "An editable companion for checking and refining the structured inputs."
    output_kicker: "Packet structure"
    output_heading: "Six linked planning views"
    preview_rows:
      - label: "Scope"
        value: "Outcomes and boundaries"
      - label: "Schedule"
        value: "Milestones and dependencies"
      - label: "Budget"
        value: "Structured cost assumptions"
      - label: "Risk"
        value: "Triggers and response notes"
    limitations:
      - "Planning support only. Every output requires human review before use."
      - "Not a certified estimate, final contract or statement of work, formal approval, government deliverable, or professional certification."
      - "No active intake, account, hosted workspace, or customer data connection is included in this preview."
    limitations_heading: "Planning support, not final authority"
    privacy_heading: "Do not enter protected information"
