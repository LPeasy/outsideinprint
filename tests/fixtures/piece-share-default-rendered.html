<div class="piece-share" data-piece-share data-share-title="Ordinary piece" data-share-url="https://outsideinprint.org/essays/fixture/" hidden>
    <div class="piece-share__actions">
      <button class="piece-share__button" type="button" data-share-trigger aria-expanded="false" aria-controls="piece-share-options"><span class="piece-share__label">Share</span></button>
      <button class="piece-share__button" type="button" data-share-copy>Copy link</button>
    </div>
    <div class="piece-share__panel" data-share-panel id="piece-share-options" hidden>
      <button class="piece-share__button" type="button" data-share-close>Close</button>
      <div class="piece-share__manual" data-share-manual hidden>
        <label for="piece-share-link">Link to this piece</label>
        <input id="piece-share-link" type="text" data-share-input value="https://outsideinprint.org/essays/fixture/" readonly spellcheck="false" aria-describedby="piece-share-status">
      </div>
    </div>
    <p class="piece-share__status" data-share-status id="piece-share-status" role="status" aria-live="polite" aria-atomic="true"></p>
  </div>
