<section class="almanack-bookshelf" aria-labelledby="almanack-bookshelf-title" style="border-top:1px solid #b0a087;padding-top:16px;">
<h2 id="almanack-bookshelf-title" style="font-size:16px;">From the Bookshelf</h2>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td width="120" valign="top" style="width:120px;padding-right:16px;">
<a href="{{ partial "almanack/email-link.html" .url }}" aria-label="Explore {{ .title }} in the Bookstore"><img src="{{ .email_image }}" alt="{{ .image_alt }}" width="104" style="display:block;width:104px;max-width:100%;height:auto;"></a>
</td><td valign="top"><h3 style="font-size:24px;line-height:1.3;margin:0 0 8px;"><a style="color:#346782;" href="{{ partial "almanack/email-link.html" .url }}">{{ .title }}</a></h3><p style="font-size:16px;margin:0 0 8px;">{{ .subtitle }}</p><p style="font-size:14px;margin:0;">By {{ .author }}</p></td></tr></table>
<p style="font-size:16px;">{{ .introduction }}</p>
{{ range .excerpts }}<blockquote style="margin:12px 0 12px 16px;"><p style="font-size:16px;margin:0;">“{{ .text }}”</p></blockquote>{{ end }}
<p style="font-size:14px;">~ {{ .excerpt_source_title }}</p>
<p style="font-size:16px;"><a style="color:#346782;text-decoration:underline;" href="{{ partial "almanack/email-link.html" .url }}">{{ .cta_label }} &rarr;</a></p>
</section>
