{{ $ornaments := .issue.bob_ornaments | default (dict) }}{{ $slot := .slot }}{{ with index $ornaments $slot }}<a class="bob-ornament" data-bob="{{ $slot }}" href="{{ .url }}" aria-label="{{ .image_alt }}" style="display:inline-block;text-decoration:none;max-width:100%;"><img src="{{ .image_url }}" alt="{{ .image_alt }}" width="{{ .width }}"{{ if eq $.issue.bob_layout "scattered-v1" }} height="{{ .height }}"{{ end }} style="display:block;width:{{ .width }}px;max-width:100%;height:auto;image-rendering:pixelated;{{ if and (eq $slot "masthead") (eq $.issue.bob_layout "scattered-v1") (strings.HasSuffix .image_url "/bob-hanging.png") }}position:relative;top:-6px;{{ end }}"></a>{{ end }}
