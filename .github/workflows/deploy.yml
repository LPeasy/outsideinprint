name: Bob arrival diagnostic (no build or deployment)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: .diagnostics
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: npm install --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - run: npx playwright install chromium --only-shell
      - run: node --test --test-concurrency=1 --test-name-pattern="mobile Read" .diagnostics/mobile_navigation_browser.test.mjs
