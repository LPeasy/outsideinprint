name: Build Hugo, Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"
      timezone: "America/New_York"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node for contract tests
        uses: actions/setup-node@v7
        with:
          node-version: "20.20.2"
          package-manager-cache: false

      - name: Test Node Contracts
        run: node --test tests/all.test.mjs

      - name: Test CI Contract
        shell: pwsh
        run: |
          ./tests/test_ci_contract.ps1

      - name: Test Responsive Image Source Contract
        shell: pwsh
        run: |
          ./tests/test_responsive_image_source_contract.ps1

      - name: Test Hugo Upgrade Contract
        shell: pwsh
        run: |
          ./tests/test_hugo_upgrade_contract.ps1

      - name: Test Essay Guardrails
        shell: pwsh
        run: |
          ./tests/test_essay_guardrails.ps1

      - name: Test Affirmation Publication Contract
        shell: pwsh
        run: |
          ./tests/test_affirmation_contract.ps1

      - name: Test Essay Image Audit
        shell: pwsh
        run: |
          ./tests/test_essay_image_audit.ps1

      - name: Test Schema Template Contract
        shell: pwsh
        run: |
          ./tests/test_schema_template_contract.ps1

      - name: Test Author Directory Contract
        shell: pwsh
        run: |
          ./tests/test_author_directory_contract.ps1

      - name: Test Apps & Tools Contract
        shell: pwsh
        run: |
          ./tests/test_apps_tools_contract.ps1

      - name: Test Indexation Policy Contract
        shell: pwsh
        run: |
          ./tests/test_indexation_policy_contract.ps1

      - name: Test Discovery Surface Contract
        shell: pwsh
        run: |
          ./tests/test_discovery_surface_contract.ps1

      - name: Test Almanack Module Data Contract
        shell: pwsh
        run: |
          ./tests/test_almanack_module_data.ps1

      - name: Test Editorial Cartoon Schedule Contract
        shell: pwsh
        run: |
          ./tests/test_editorial_cartoon_schedule_contract.ps1

      - name: Test SEO Rollout Contract
        shell: pwsh
        run: |
          ./tests/test_seo_rollout_contract.ps1

      - name: Test Legacy Render Contract
        shell: pwsh
        run: |
          ./tests/test_legacy_render_contract.ps1

      - name: Audit Essay Images
        shell: pwsh
        run: |
          ./scripts/audit_essay_images.ps1 -FailOnIssues

      - name: Check Essay Guardrails
        shell: pwsh
        run: |
          $base = "${{ github.event.before }}"
          if ([string]::IsNullOrWhiteSpace($base) -or ($base -match '^0+$')) {
            $base = (git rev-parse HEAD^ 2>$null)
          }

          if ([string]::IsNullOrWhiteSpace($base)) {
            ./scripts/check_essay_guardrails.ps1 -RequireDescription -RequireFeaturedImage -RequireEditorialPhilosophyAudit
          }
          else {
            ./scripts/check_essay_guardrails.ps1 -BaseRef $base -HeadRef "${{ github.sha }}" -RequireDescription -RequireFeaturedImage -RequireEditorialPhilosophyAudit
          }

  build:
    runs-on: ubuntu-latest
    needs: contracts
    timeout-minutes: 20
    env:
      HUGO_ENVIRONMENT: production
      TZ: America/New_York
      ANALYTICS_ENABLED: ${{ vars.ANALYTICS_ENABLED }}
      ANALYTICS_ALLOW_LOCAL: ${{ vars.ANALYTICS_ALLOW_LOCAL }}
      GOATCOUNTER_SITE_URL: ${{ vars.GOATCOUNTER_SITE_URL }}
      GOATCOUNTER_SCRIPT_SRC: ${{ vars.GOATCOUNTER_SCRIPT_SRC }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Setup Hugo (extended)
        shell: bash
        run: |
          set -euo pipefail
          version="0.164.0"
          archive_sha256="fea17b8c076f950bb2e9f9486667bdaa29422883888d509d63931c73e8a9b3a4"
          tools_dir="${RUNNER_TEMP}/hugo-${version}"
          archive_path="${RUNNER_TEMP}/hugo_extended_${version}_linux-amd64.tar.gz"
          download_url="https://github.com/gohugoio/hugo/releases/download/v${version}/hugo_extended_${version}_linux-amd64.tar.gz"
          rm -rf "${tools_dir}"
          mkdir -p "${tools_dir}"
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 -o "${archive_path}" "${download_url}"
          echo "${archive_sha256}  ${archive_path}" | sha256sum --check --strict
          tar -xzf "${archive_path}" -C "${tools_dir}"
          echo "${tools_dir}" >> "${GITHUB_PATH}"
          installed_version="$("${tools_dir}/hugo" version)"
          echo "${installed_version}"
          [[ "${installed_version}" == hugo\ v${version}*+extended* ]]

      - name: Cache Hugo image resources
        id: hugo-image-cache
        uses: actions/cache@v5
        with:
          path: resources/_gen
          key: >-
            ${{ runner.os }}-hugo-resources-0.164.0-${{ hashFiles('tools/toolchain.manifest.json', 'hugo.toml', 'data/image-assets.json', 'assets/images/originals/**', 'layouts/partials/images/**', 'layouts/_default/_markup/render-image.html', 'layouts/partials/metadata_image.html', 'layouts/partials/opengraph.html', 'layouts/partials/twitter_cards.html', 'layouts/partials/schema/image.html') }}

      - name: Verify Toolchain
        shell: bash
        run: |
          set -euo pipefail
          hugo version

      - name: Build Hugo
        shell: bash
        run: |
          set -euo pipefail
          start_epoch="$(date +%s)"
          hugo --gc --minify --panicOnWarning
          elapsed_seconds="$(( $(date +%s) - start_epoch ))"
          limit_seconds=900
          build_lane="cold"
          if [[ "${{ steps.hugo-image-cache.outputs.cache-hit }}" == "true" ]]; then
            limit_seconds=300
            build_lane="restored-cache"
          fi
          echo "Hugo image build lane=${build_lane} elapsed_seconds=${elapsed_seconds} limit_seconds=${limit_seconds}"
          if (( elapsed_seconds > limit_seconds )); then
            echo "Hugo ${build_lane} image build exceeded ${limit_seconds} seconds." >&2
            exit 1
          fi

      - name: Remove public PDF artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ./public/pdfs

      - name: Write Public Build Manifest
        shell: pwsh
        run: |
          ./tests/write_public_build_manifest.ps1

      - name: Test Public Route Smoke
        shell: pwsh
        run: |
          ./tests/test_public_route_smoke.ps1

      - name: Test Public HTML Output
        shell: pwsh
        run: |
          ./tests/test_public_html_output.ps1 -RequireFreshBuild

      - name: Test Games Catalog Output
        shell: pwsh
        run: |
          ./tests/test_games_catalog_contract.ps1 -SiteDir public -Mode Production

      - name: Test Responsive Image Output Contract
        shell: pwsh
        run: |
          ./tests/test_responsive_image_output_contract.ps1 -SiteDir public

      - name: Show Public Route Debug
        if: failure()
        shell: pwsh
        run: |
          ./tests/show_public_route_debug.ps1

      - name: Upload Public Route Debug Artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: public-route-debug
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            public/authors/**
            public/about/**
            public/random/**
            public/apps/**
            public/games/**
            public/.oip-build-manifest.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Wait for Pages propagation
        shell: bash
        run: sleep 20

      - name: Live SEO Smoke Test
        shell: pwsh
        run: |
          ./tests/test_live_seo_smoke.ps1 -BaseUrl "${{ steps.deployment.outputs.page_url }}"

      - name: Canonical Host SEO Smoke Test
        shell: pwsh
        run: |
          $attempts = 6
          $delaySeconds = 20
          $lastError = $null

          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            try {
              ./tests/test_live_seo_smoke.ps1 -BaseUrl "https://outsideinprint.org"
              $lastError = $null
              break
            }
            catch {
              $lastError = $_
              if ($attempt -lt $attempts) {
                Start-Sleep -Seconds $delaySeconds
              }
            }
          }

          if ($null -ne $lastError) {
            throw $lastError
          }

      - name: SEO Rollout Probe
        if: always()
        shell: pwsh
        run: |
          ./scripts/probe_seo_rollout.ps1 -OutputDir ./.deploy-reports/seo-rollout -UpdateWorksheet:$false

      - name: Upload SEO Rollout Probe Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: seo-rollout-probe
          if-no-files-found: warn
          path: ./.deploy-reports/seo-rollout/**
