name: Build Hugo, Deploy to GitHub Pages
run-name: ${{ inputs.release_request_id && format('OIP release {0}', inputs.release_request_id) || github.event.pull_request.title || github.event.head_commit.message || github.workflow }}
on:
  push:
    branches:
      - main
  pull_request: null
  workflow_dispatch:
    inputs:
      full_checks:
        description: Run all active fixture, browser, Windows and worker suites
        type: boolean
        default: true
      release_ids:
        description: JSON array of approved scheduled release IDs (dispatcher only)
        type: string
        default: ''
      release_request_id:
        description: Unique dispatcher request UUID
        type: string
        default: ''
      release_expected_sha:
        description: Current main SHA observed by the dispatcher
        type: string
        default: ''
      release_probe:
        description: Validate admission without building or deploying
        type: boolean
        default: false
  schedule:
    - cron: 17 0 * * 1
      timezone: America/New_York
    - cron: 17 0 * * 0,2-6
      timezone: America/New_York
    # BEGIN GENERATED SCHEDULED RELEASES
    # Generated UTC instants; absolute registry windows prevent later-year releases.
    - cron: 0 13 25,26,27 10 *
      timezone: UTC
    - cron: 30 13 27 10 *
      timezone: UTC
    - cron: 0 15 27 10 *
      timezone: UTC
    # END GENERATED SCHEDULED RELEASES
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      site: ${{ steps.selection.outputs.site }}
      browser: ${{ steps.selection.outputs.browser }}
      browser_navigation: ${{ steps.selection.outputs.browser_navigation }}
      browser_bob: ${{ steps.selection.outputs.browser_bob }}
      browser_analytics: ${{ steps.selection.outputs.browser_analytics }}
      browser_share: ${{ steps.selection.outputs.browser_share }}
      images: ${{ steps.selection.outputs.images }}
      publishing: ${{ steps.selection.outputs.publishing }}
      rendering: ${{ steps.selection.outputs.rendering }}
      windows: ${{ steps.selection.outputs.windows }}
      windows_checkout: ${{ steps.selection.outputs.windows_checkout }}
      worker: ${{ steps.selection.outputs.worker }}
      worker_commerce: ${{ steps.selection.outputs.worker_commerce }}
      worker_bob: ${{ steps.selection.outputs.worker_bob }}
      worker_welcome: ${{ steps.selection.outputs.worker_welcome }}
      worker_meta_leads: ${{ steps.selection.outputs.worker_meta_leads }}
      worker_release_dispatcher: ${{ steps.selection.outputs.worker_release_dispatcher }}
      seo: ${{ steps.selection.outputs.seo }}
      full: ${{ steps.selection.outputs.full }}
      clock: ${{ steps.selection.outputs.clock }}
      release_slug: ${{ steps.selection.outputs.release_slug }}
      release_ids: ${{ steps.selection.outputs.release_ids }}
      base: ${{ steps.selection.outputs.base }}
      selection: ${{ steps.selection.outputs.selection }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |-
            .github
            scripts/ci
            tests
            tools
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install workflow parser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check workflow safety and selectors
        run: |
          node --test tests/ci_workflow.test.mjs tests/browser_environment.test.mjs tests/classify_changes.test.mjs tests/disney_release_schedule.test.mjs tests/scheduled_releases.test.mjs tests/image_cache.test.mjs tests/release_gate.test.mjs tests/verify_deployment.test.mjs tests/deployment_head.test.mjs
          node --test tests/release_request.test.mjs tests/shop_feed_inventory.test.mjs
          python3 -m unittest discover -s tests -p test_disney_release_verification.py
          python3 -m unittest discover -s tests -p test_scheduled_release_verification.py
          node scripts/ci/scheduled_releases.mjs --check
          node scripts/ci/scheduled_releases.mjs --check-pending
      - name: Select checks and publication clock
        id: selection
        env:
          OIP_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          OIP_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          OIP_FULL_CHECKS: ${{ inputs.full_checks }}
          OIP_PROTECTED_MAIN: ${{ github.ref_protected && vars.CI_BRANCH_PROTECTION_ACTIVE == 'true' }}
          OIP_SCHEDULE: ${{ github.event.schedule }}
          OIP_RELEASE_IDS: ${{ inputs.release_ids }}
          OIP_RELEASE_REQUEST_ID: ${{ inputs.release_request_id }}
          OIP_RELEASE_EXPECTED_SHA: ${{ inputs.release_expected_sha }}
          OIP_RELEASE_PROBE: ${{ inputs.release_probe }}
        run: node scripts/ci/classify_changes.mjs
      - name: Save release admission receipt
        if: ${{ always() && inputs.release_request_id != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-dispatch
          path: .release-dispatch/**
          include-hidden-files: true
          if-no-files-found: warn
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    needs:
      - classify
    if: ${{ needs.classify.outputs.windows == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Fixtures retain their exact review records and affirmation originals,
          # without downloading the full 1.3 GiB image library on Windows.
          sparse-checkout: ${{ needs.classify.outputs.windows_checkout }}
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Image tooling on Windows
        if: ${{ needs.classify.outputs.images == 'true' }}
        shell: pwsh
        run: |-
          ./tests/test_managed_image_registration.ps1
          ./tests/test_focused_image_review_promotion.ps1
      - name: Publishing tooling on Windows
        if: ${{ needs.classify.outputs.publishing == 'true' }}
        shell: pwsh
        run: |-
          ./tests/test_essay_guardrails.ps1
          ./tests/test_essay_image_audit.ps1
          ./tests/test_affirmation_contract.ps1
          ./tests/test_almanack_buttondown_numbering.ps1
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - classify
    if: ${{ needs.classify.outputs.worker == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |-
            workers/oip-commerce
            workers/oip-bob
            workers/oip-welcome
            workers/oip-meta-leads
            workers/oip-release-dispatcher
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Worker behavior, monitoring and tax fixtures
        if: ${{ needs.classify.outputs.worker_commerce == 'true' }}
        run: npm --prefix workers/oip-commerce test
      - name: Worker provisioning fixtures
        if: ${{ needs.classify.outputs.worker_commerce == 'true' }}
        run: python3 -m unittest discover -s workers/oip-commerce/test -p 'test_*.py'
      - name: Welcome enrollment, confirmation and duplicate prevention fixtures
        if: ${{ needs.classify.outputs.worker_welcome == 'true' }}
        run: node --test workers/oip-welcome/test/*.test.mjs
      - name: Meta lead consent, pending enrollment and bounded transfer fixtures
        if: ${{ needs.classify.outputs.worker_meta_leads == 'true' }}
        run: node --test workers/oip-meta-leads/test/*.test.mjs
      - name: Install Bob local runtime test dependencies
        if: ${{ needs.classify.outputs.worker_bob == 'true' }}
        run: npm --prefix workers/oip-bob ci --ignore-scripts --no-audit --no-fund
      - name: Bob recommendations, budgets and local Workers runtime
        if: ${{ needs.classify.outputs.worker_bob == 'true' }}
        run: npm --prefix workers/oip-bob test
      - name: Release dispatcher eligibility, idempotency and receipt fixtures
        if: ${{ needs.classify.outputs.worker_release_dispatcher == 'true' }}
        run: node --test workers/oip-release-dispatcher/test/*.test.mjs
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs:
      - classify
      - windows
      - worker
    if: ${{ !cancelled() && needs.classify.result == 'success' && needs.classify.outputs.site == 'true' && (needs.windows.result == 'success' || (needs.classify.outputs.windows == 'false' && needs.windows.result == 'skipped')) && (needs.worker.result == 'success' || (needs.classify.outputs.worker == 'false' && needs.worker.result == 'skipped')) }}
    outputs:
      generated_at: ${{ steps.manifest.outputs.generated_at }}
    env:
      HUGO_ENVIRONMENT: production
      TZ: America/New_York
      ANALYTICS_ENABLED: ${{ vars.ANALYTICS_ENABLED }}
      ANALYTICS_ALLOW_LOCAL: ${{ vars.ANALYTICS_ALLOW_LOCAL }}
      ANALYTICS_PURCHASE_ENABLED: ${{ vars.ANALYTICS_PURCHASE_ENABLED }}
      ANALYTICS_PURCHASE_MEASUREMENT_ID: ${{ vars.ANALYTICS_PURCHASE_MEASUREMENT_ID }}
      OIP_BUILD_CLOCK_UTC: ${{ needs.classify.outputs.clock }}
      OIP_HUGO_BIN: hugo
      OIP_HUGO_CONFIG: hugo.toml
      OIP_PUBLISHED_INVENTORY_PATH: ${{ github.workspace }}/.ci-published-inventory.json
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Setup Hugo (extended)
        shell: bash
        run: |
          set -euo pipefail
          version="0.167.0"
          archive_sha256="0163f5c3deddac1f494a1629ddc40c65d18de9d5794facd98f7f96ac2c7d8957"
          tools_dir="${RUNNER_TEMP}/hugo-${version}"
          archive_path="${RUNNER_TEMP}/hugo_extended_${version}_linux-amd64.tar.gz"
          download_url="https://github.com/gohugoio/hugo/releases/download/v${version}/hugo_extended_${version}_linux-amd64.tar.gz"
          rm -rf "${tools_dir}"
          mkdir -p "${tools_dir}"
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 -o "${archive_path}" "${download_url}"
          echo "${archive_sha256}  ${archive_path}" | sha256sum --check --strict
          tar -xzf "${archive_path}" -C "${tools_dir}"
          echo "${tools_dir}" >> "${GITHUB_PATH}"
          installed_version="$("${tools_dir}/hugo" version)"
          echo "${installed_version}"
          [[ "${installed_version}" == hugo\ v${version}*+extended* ]]
      - name: Test Node source contracts
        run: node --test tests/all.test.mjs
      - name: Test Responsive Image Source Contract
        shell: pwsh
        run: |
          ./tests/test_responsive_image_source_contract.ps1
      - name: Test Bookstore Reading Sample Source Contract
        shell: pwsh
        run: |
          ./tests/test_bookstore_reading_sample_contract.ps1 -SourceOnly
          ./tests/test_2045_storefront.ps1 -SourceOnly
          ./tests/test_direct_commerce_storefront_contract.ps1 -SourceOnly
      - name: Test Schema Template Contract
        shell: pwsh
        run: |
          ./tests/test_schema_template_contract.ps1
      - name: Test Author Directory Contract
        shell: pwsh
        run: |
          ./tests/test_author_directory_contract.ps1
      - name: Test Contributor Header Contract
        shell: pwsh
        run: ./tests/test_contributor_header_contract.ps1
      - name: Test Apps & Tools Contract
        shell: pwsh
        run: |
          ./tests/test_apps_tools_contract.ps1
      - name: Test Indexation Policy Contract
        shell: pwsh
        run: |
          ./tests/test_indexation_policy_contract.ps1
      - name: Test Discovery Surface Contract
        shell: pwsh
        run: |
          ./tests/test_discovery_surface_contract.ps1
          ./tests/test_feed_policy_contract.ps1 -SourceOnly
      - name: Test Almanack Module Data Contract
        shell: pwsh
        run: |
          ./tests/test_almanack_module_data.ps1
      - name: Test Editorial Cartoon Schedule Contract
        shell: pwsh
        run: |-
          ./tests/test_editorial_cartoon_schedule_contract.ps1 -SourceOnly -Clock $env:OIP_BUILD_CLOCK_UTC
      - name: Test Legacy Render Contract
        shell: pwsh
        run: |
          ./tests/test_legacy_render_contract.ps1
          ./tests/test_imported_content_media.ps1
      - name: Audit Essay Images
        shell: pwsh
        run: |
          ./scripts/audit_essay_images.ps1 -FailOnIssues
      - name: Test Collection Organization Source Contract
        shell: pwsh
        run: ./tests/test_collection_organization_contract.ps1 -Clock $env:OIP_BUILD_CLOCK_UTC
      - name: Test Bob generated reading catalog
        if: ${{ needs.classify.outputs.rendering == 'true' }}
        shell: pwsh
        run: ./tests/test_bob_catalog_contract.ps1
      - name: Check changed publication prose
        shell: pwsh
        run: |-
          $base = $env:OIP_BASE_SHA
          if ($base) {
            ./scripts/check_essay_guardrails.ps1 -BaseRef $base -HeadRef HEAD -RequireDescription -RequireFeaturedImage -RequireEditorialPhilosophyAudit
          } else {
            ./scripts/check_essay_guardrails.ps1 -AllEssays -RequireDescription -RequireFeaturedImage -RequireEditorialPhilosophyAudit
          }
        env:
          OIP_BASE_SHA: ${{ needs.classify.outputs.base }}
      - name: Test Focused Legacy Image Migration Contract
        shell: pwsh
        run: |
          ./tests/test_focused_legacy_image_migration.ps1
        if: ${{ needs.classify.outputs.images == 'true' }}
      - name: Test Focused Image Review Promotion Contract
        shell: pwsh
        run: |
          ./tests/test_focused_image_review_promotion.ps1
        if: ${{ needs.classify.outputs.images == 'true' }}
      - name: Test Managed Image Registration
        shell: pwsh
        run: ./tests/test_managed_image_registration.ps1
        if: ${{ needs.classify.outputs.images == 'true' }}
      - name: Test cartoon publishing fixtures
        if: ${{ needs.classify.outputs.publishing == 'true' }}
        shell: pwsh
        run: ./tests/test_editorial_cartoon_schedule_contract.ps1 -Clock $env:OIP_BUILD_CLOCK_UTC
      - name: Test Essay Guardrails
        shell: pwsh
        run: |
          ./tests/test_essay_guardrails.ps1
        if: ${{ needs.classify.outputs.publishing == 'true' }}
      - name: Test Affirmation Publication Contract
        shell: pwsh
        run: |
          ./tests/test_affirmation_contract.ps1
      - name: Test Essay Image Audit
        shell: pwsh
        run: |
          ./tests/test_essay_image_audit.ps1
        if: ${{ needs.classify.outputs.publishing == 'true' }}
      - name: Test Almanack Email Review Renderer and Numbering Installer
        run: python3 -m unittest discover -s tests -p 'test_almanack*.py'
        if: ${{ needs.classify.outputs.publishing == 'true' }}
      - name: Test Buttondown Canonical Number Readback
        shell: pwsh
        run: ./tests/test_almanack_buttondown_numbering.ps1
        if: ${{ needs.classify.outputs.publishing == 'true' }}
      - name: Test Hugo Upgrade Contract
        shell: pwsh
        run: |
          ./tests/test_hugo_upgrade_contract.ps1
        if: ${{ needs.classify.outputs.rendering == 'true' }}
      - name: Test SEO Rollout Contract
        shell: pwsh
        run: |
          ./tests/test_seo_rollout_contract.ps1
        if: ${{ needs.classify.outputs.seo == 'true' && (github.event_name == 'pull_request' || needs.classify.outputs.full == 'true') }}
      - name: Test image resource reuse
        if: ${{ needs.classify.outputs.images == 'true' }}
        run: node --test tests/responsive_image_cache_behavior.test.mjs
      - name: Test image signature policy
        if: ${{ needs.classify.outputs.images == 'true' }}
        shell: pwsh
        run: ./tests/test_image_signatures.ps1
      - name: Fingerprint image resources
        id: image-key
        run: |-
          hugo config --format json > "$RUNNER_TEMP/hugo-config.json"
          node scripts/ci/image_cache.mjs "$RUNNER_TEMP/hugo-config.json"
      - name: Restore compatible Hugo image resources
        id: image-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: resources/_gen
          key: ${{ steps.image-key.outputs.key }}
          restore-keys: ${{ steps.image-key.outputs.prefix }}
      - name: Build Hugo
        shell: bash
        run: |
          set -euo pipefail
          start_epoch="$(date +%s)"
          hugo --gc --minify --panicOnWarning --clock "$OIP_BUILD_CLOCK_UTC"
          elapsed_seconds="$(( $(date +%s) - start_epoch ))"
          limit_seconds=1200
          build_lane="cold"
          if [[ "${{ steps.image-cache.outputs.cache-hit }}" == "true" ]]; then
            limit_seconds=300
            build_lane="exact-cache"
          elif [[ -n "${{ steps.image-cache.outputs.cache-matched-key }}" ]]; then
            build_lane="compatible-cache"
          fi
          echo "Hugo image build lane=${build_lane} elapsed_seconds=${elapsed_seconds} limit_seconds=${limit_seconds}"
          if (( elapsed_seconds > limit_seconds )); then
            echo "Hugo ${build_lane} image build exceeded ${limit_seconds} seconds." >&2
            exit 1
          fi
      - name: Test Homepage Output and Selection
        env:
          OIP_HUGO_CONFIG: hugo.toml
          OIP_SITE_DIR: public
          OIP_HUGO_BIN: hugo
        run: |
          node --test tests/homepage_output.test.mjs tests/point7_ux_output.test.mjs
      - name: Test Reader Refinements
        env:
          OIP_SITE_DIR: public
          OIP_HUGO_BIN: hugo
        run: node --test tests/reader_refinements_output.test.mjs tests/bookstore_ebook_labels.test.mjs tests/article_contents.test.mjs tests/article_mobile_layout.test.mjs tests/reader_actions_output.test.mjs tests/contributor_pitch.test.mjs
      - name: Test rendering behavior fixtures
        if: ${{ needs.classify.outputs.rendering == 'true' }}
        run: node --test tests/homepage_selection_behavior.test.mjs tests/gallery_reading_behavior.test.mjs tests/collection_reading_path_behavior.test.mjs
      - name: Prepare browser test environment
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/ci/run_browser_tests.mjs --prepare
        if: ${{ needs.classify.outputs.browser == 'true' }}
      - name: Test Mobile Navigation
        run: node scripts/ci/run_browser_tests.mjs tests/mobile_navigation_browser.test.mjs
        if: ${{ needs.classify.outputs.browser_navigation == 'true' }}
      - name: Test Bob reading and collection browsing
        run: node scripts/ci/run_browser_tests.mjs tests/bob_reading_browser.test.mjs
        if: ${{ needs.classify.outputs.browser_bob == 'true' }}
      - name: Test Hosted Analytics Network Privacy
        if: ${{ needs.classify.outputs.browser_analytics == 'true' && env.ANALYTICS_ENABLED == 'true' }}
        run: node scripts/ci/run_browser_tests.mjs tests/hosted_analytics_browser.test.mjs
      - name: Test Piece Sharing
        run: node scripts/ci/run_browser_tests.mjs tests/piece_share_browser.test.mjs
        if: ${{ needs.classify.outputs.browser_share == 'true' }}
      - name: Remove public PDF artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ./public/pdfs
      - name: Write Public Build Manifest
        shell: pwsh
        run: |
          ./tests/write_public_build_manifest.ps1 -Clock $env:OIP_BUILD_CLOCK_UTC
          node scripts/ci/write_publication_identity.mjs public/.oip-build-manifest.json
        id: manifest
      - name: Test Public Route Smoke
        shell: pwsh
        run: |
          ./tests/test_public_route_smoke.ps1
      - name: Test Bookstore Reading Sample Output Contract
        shell: pwsh
        run: |
          ./tests/test_bookstore_reading_sample_contract.ps1 -SiteDir public
          ./tests/test_2045_storefront.ps1 -SiteDir public
          ./tests/test_direct_commerce_storefront_contract.ps1 -SiteDir public
      - name: Install output-check dependencies
        if: ${{ needs.classify.outputs.browser != 'true' }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test Public HTML Output
        shell: pwsh
        run: |
          ./tests/test_public_html_output.ps1 -RequireFreshBuild -Clock $env:OIP_BUILD_CLOCK_UTC
          ./tests/test_feed_policy_contract.ps1 -SiteDir public
      - name: Test Release A Metadata Output
        run: node --test tests/release_a_metadata_output.test.mjs
      - name: Test Games Catalog Output
        shell: pwsh
        run: |
          ./tests/test_games_catalog_contract.ps1 -SiteDir public -Mode Production
      - name: Test Responsive Image Output Contract
        shell: pwsh
        run: |
          ./tests/test_responsive_image_output_contract.ps1 -SiteDir public
      - name: Show Public Route Debug
        if: failure()
        shell: pwsh
        run: |
          ./tests/show_public_route_debug.ps1
      - name: Upload Public Route Debug Artifact
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: public-route-debug
          if-no-files-found: warn
          include-hidden-files: true
          path: |-
            public/authors/**
            public/about/**
            public/random/**
            public/apps/**
            public/games/**
            public/.oip-build-manifest.json

            .deploy-reports/**
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./public
          include-hidden-files: true
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      - name: Save validated production image resources
        if: ${{ success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.image-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: resources/_gen
          key: ${{ steps.image-key.outputs.key }}
  release-ready:
    name: release-ready
    if: always()
    runs-on: ubuntu-latest
    needs:
      - classify
      - site
      - windows
      - worker
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Require every selected prerequisite
        env:
          OIP_NEEDS_JSON: ${{ toJSON(needs) }}
          OIP_SELECTED_JSON: ${{ needs.classify.outputs.selection }}
        run: node scripts/ci/release_gate.mjs
  deploy:
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.classify.result == 'success' && needs.site.result == 'success' && needs.release-ready.result == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs:
      - classify
      - site
      - release-ready
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |-
            scripts/ci
            tests
            reports/seo-rollout
            content/essays
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Check deployment still matches current main
        id: deployment-head
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/check_deployment_head.mjs
      - name: Deploy
        id: deployment
        if: ${{ steps.deployment-head.outputs.current == 'true' }}
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Verify canonical publication manifest
        if: ${{ steps.deployment-head.outputs.current == 'true' }}
        env:
          OIP_EXPECTED_SHA: ${{ github.sha }}
          OIP_EXPECTED_GENERATED_AT: ${{ needs.site.outputs.generated_at }}
        run: node scripts/ci/verify_deployment.mjs
      - name: Confirm published commit still matches current main
        id: deployment-head-final
        if: ${{ steps.deployment-head.outputs.current == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OIP_REQUIRE_CURRENT: 'true'
          OIP_DEPLOYMENT_HEAD_REPORT: .deploy-reports/deployment-head-final.json
        run: node scripts/ci/check_deployment_head.mjs
      - name: Verify canonical routes and SEO
        if: ${{ steps.deployment-head-final.outcome == 'success' && steps.deployment-head-final.outputs.current == 'true' }}
        shell: pwsh
        run: ./tests/test_live_seo_smoke.ps1 -BaseUrl "https://outsideinprint.org"
      - name: Verify scheduled Disney release
        if: ${{ always() && needs.classify.outputs.release_slug != '' && steps.deployment-head-final.outcome == 'success' && steps.deployment-head-final.outputs.current == 'true' }}
        env:
          OIP_RELEASE_SLUG: ${{ needs.classify.outputs.release_slug }}
          OIP_EXPECTED_SHA: ${{ github.sha }}
          OIP_EXPECTED_GENERATED_AT: ${{ needs.site.outputs.generated_at }}
        run: python3 scripts/ci/verify_disney_release.py
      - name: Verify scheduled releases
        if: ${{ always() && needs.classify.outputs.release_ids != '[]' && needs.classify.outputs.release_ids != '' && steps.deployment-head-final.outcome == 'success' && steps.deployment-head-final.outputs.current == 'true' }}
        env:
          OIP_RELEASE_IDS: ${{ needs.classify.outputs.release_ids }}
          OIP_EXPECTED_SHA: ${{ github.sha }}
          OIP_EXPECTED_GENERATED_AT: ${{ needs.site.outputs.generated_at }}
        run: python3 scripts/ci/verify_scheduled_releases.py
      - name: SEO Rollout Probe
        if: ${{ always() && steps.deployment-head-final.outcome == 'success' && steps.deployment-head-final.outputs.current == 'true' && steps.deployment.outcome == 'success' && needs.classify.outputs.seo == 'true' }}
        shell: pwsh
        run: |
          ./scripts/probe_seo_rollout.ps1 -OutputDir ./.deploy-reports/seo-rollout -UpdateWorksheet:$false
      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: deployment-diagnostics
          if-no-files-found: warn
          include-hidden-files: true
          path: .deploy-reports/**
