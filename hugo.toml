baseURL = "https://outsideinprint.org/"
title = "Outside In Print"
locale = "en-US"
timeZone = "America/New_York"

enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[mediaTypes."application/json"]
suffixes = ["json"]

[outputFormats.LibraryIndex]
mediaType = "application/json"
baseName = "index"
isPlainText = true
notAlternative = true

[outputFormats.BobCatalog]
mediaType = "application/json"
baseName = "catalog"
isPlainText = true
notAlternative = true

[outputs]
home = ["HTML", "RSS"]
page = ["HTML"]
section = ["HTML"]

[permalinks]
essays = "/essays/:slug/"
syd-and-oliver = "/syd-and-oliver/:slug/"
working-papers = "/working-papers/:slug/"
collections = "/collections/:slug/"
apps = "/apps/:slug/"
games = "/games/:slug/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[security]
[security.funcs]
    getenv = ['^HUGO_', '^CI$', '^ANALYTICS_', '^GOATCOUNTER_']

[params]
description = "Independent essays and reported analysis for readers who want to move beyond the feed, follow the evidence, and think for themselves."

[params.homepage]
imprint_statement = "Outside In Print publishes essays, dialogues, reported case studies, and working papers in stable, citable web editions organized by collections, archive lanes, and the full library."

[params.newsletter]
provider = "buttondown"
# Set this to your real Buttondown username to enable the signup form.
buttondown_username = "OutsideInPrint"
tag = "outside-in-print"
publication_tag = "new-publications"
cadence = "Every Saturday"
title = "The weekly newsletter"
contents = "New essays, original pictures, and selected archive work from Outside In Print. Free each Saturday, plus three short introductory emails after you confirm."
price_promise = "Free. Each email series has an unsubscribe link."
button_label = "Join the newsletter"
prompt_label = "Join the weekly Outside In Print newsletter."
checkout_label = "Send me the weekly Outside In Print newsletter. Free. No spam ever."
sample_url = "/collections/bobs-almanack/"
sample_label = "Read the latest issue"
privacy_promise = "Buttondown manages the Saturday newsletter. Resend delivers three introductory emails, including an optional Pressroom invitation. The two email series have separate unsubscribe links. Outside In Print does not sell or rent subscriber information."
privacy_url = "/privacy/"
privacy_label = "Privacy details"

[params.analytics]
enabled = false
allow_local = false

[params.pressroom]
url = "https://www.patreon.com/bobviously"
start_here_url = "https://www.patreon.com/bobviously/posts/start-here-what-173281800"
pressroom_join_url = "https://www.patreon.com/checkout/bobviously?rid=29901304"
correspondence_join_url = "https://www.patreon.com/checkout/bobviously?rid=29903630"
desk_join_url = "https://www.patreon.com/checkout/bobviously?rid=29903634"

[params.purchase_analytics]
enabled = false
measurement_id = ""

[params.commerce]
api_base = "https://downloads.outsideinprint.org"
support_checkout_enabled = true
custom_monthly_enabled = false

[params.paper_route]
enabled = true

# Owner-approved production endpoint. Free discovery uses the same-build public
# catalog and remains available when the Worker is disabled or out of allowance.
[params.bob_reading]
enabled = true
api_base = "https://oip-bob-reading.red-snow-678d.workers.dev"

# Keep legacy originals on disk while publishing only their signed derivatives.
