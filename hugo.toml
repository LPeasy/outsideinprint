baseURL = "https://outsideinprint.org/"
title = "Outside In Print"
locale = "en-US"
timeZone = "America/New_York"

enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[mediaTypes."application/json"]
suffixes = ["json"]

[outputFormats.LibraryIndex]
mediaType = "application/json"
baseName = "index"
isPlainText = true
notAlternative = true

[outputs]
home = ["HTML", "RSS"]
page = ["HTML"]
section = ["HTML"]

[permalinks]
essays = "/essays/:slug/"
syd-and-oliver = "/syd-and-oliver/:slug/"
working-papers = "/working-papers/:slug/"
collections = "/collections/:slug/"
apps = "/apps/:slug/"
games = "/games/:slug/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[security]
[security.funcs]
    getenv = ['^HUGO_', '^CI$', '^ANALYTICS_', '^GOATCOUNTER_']

[params]
description = "Independent essays and reported analysis for readers who want to move beyond the feed, follow the evidence, and think for themselves."

[params.homepage]
imprint_statement = "Outside In Print publishes essays, dialogues, reported case studies, and working papers in stable, citable web editions organized by collections, archive lanes, and the full library."

[params.newsletter]
provider = "buttondown"
# Set this to your real Buttondown username to enable the signup form.
buttondown_username = "OutsideInPrint"
tag = "outside-in-print"
publication_tag = "new-publications"
cadence = "Every Saturday"
title = "The weekly newsletter"
contents = "New essays, original visuals, and selected archive work from Outside In Print. One thoughtful email each week."
price_promise = "Free. No spam ever. Unsubscribe anytime."
button_label = "Join the newsletter"
prompt_label = "Join the weekly Outside In Print newsletter."
checkout_label = "Send me the weekly Outside In Print newsletter. Free. No spam ever."
sample_url = "/almanack/2026-07-25/"
sample_label = "Read a sample issue"
privacy_promise = "Your email goes to Buttondown to deliver and manage the Outside In Print newsletter. Outside In Print does not sell or rent subscriber information. Unsubscribe anytime."
privacy_url = "/privacy/"
privacy_label = "Privacy details"

[params.analytics]
enabled = false
allow_local = false

[params.commerce]
api_base = "https://downloads.outsideinprint.org"
support_checkout_enabled = true
custom_monthly_enabled = false

[params.paper_route]
enabled = true
