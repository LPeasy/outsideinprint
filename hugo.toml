baseURL = "https://outsideinprint.org/"
title = "Outside In Print"
locale = "en-US"
timeZone = "America/New_York"

enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[permalinks]
essays = "/essays/:slug/"
syd-and-oliver = "/syd-and-oliver/:slug/"
working-papers = "/working-papers/:slug/"
collections = "/collections/:slug/"
apps = "/apps/:slug/"
games = "/games/:slug/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[security]
  [security.funcs]
    getenv = ['^HUGO_', '^CI$', '^ANALYTICS_', '^GOATCOUNTER_']

[params.homepage]
imprint_statement = "Outside In Print publishes essays, dialogues, reported case studies, and working papers in stable, citable web editions organized by collections, archive lanes, and the full library."

[params.newsletter]
provider = "buttondown"
# Set this to your real Buttondown username to enable the signup form.
buttondown_username = "OutsideInPrint"
tag = "outside-in-print"
publication_tag = "new-publications"
cadence = "Every Saturday"
title = "Bob's Almanack"
contents = "Each Saturday's issue usually brings four new essays or notes with cartoons, a weekly virtue, one number, one public document, results, records, final bows, obituaries, and one piece worth reprinting."
price_promise = "Bob's Almanack will remain free. No ads, ever."
button_label = "Subscribe free"
checkout_label = "Send me Bob's Almanack every Saturday. It will remain free. No ads, ever."
sample_url = "/almanack/2026-07-25/"
sample_label = "Read a sample issue"
privacy_promise = "Your email goes to Buttondown to deliver and manage Bob's Almanack. Outside In Print does not sell or rent subscriber information. Unsubscribe anytime."
privacy_url = "/privacy/"
privacy_label = "Privacy details"

[params.analytics]
enabled = false
allow_local = false

[params.analytics.goatcounter]
site_url = "https://outsideinprint.goatcounter.com"
script_src = "https://gc.zgo.at/count.v5.js"
script_integrity = "sha384-atnOLvQb9t+jTSipvd75X2yginT4PjVbqDdlJAmxMm+wYElFmeR6EmLP5bYeoRVQ"
script_crossorigin = "anonymous"

[params.commerce]
api_base = "https://downloads.outsideinprint.org"
support_checkout_enabled = true
custom_monthly_enabled = false

[params.paper_route]
enabled = true
